apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: abzora-api-hpa
  namespace: abzora
spec:
  minReplicas: 2
  maxReplicas: 8
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: abzora-worker-hpa
  namespace: abzora
spec:
  minReplicas: 1
  maxReplicas: 6
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: abzora-websocket-hpa
  namespace: abzora
spec:
  minReplicas: 1
  maxReplicas: 5
