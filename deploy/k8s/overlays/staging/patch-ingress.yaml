apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: abzora-api-ingress
spec:
  tls:
    - hosts:
        - api.staging.abzora.example.com
      secretName: staging-abzora-api-tls
  rules:
    - host: api.staging.abzora.example.com
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: abzora-websocket-ingress
spec:
  tls:
    - hosts:
        - ws.staging.abzora.example.com
      secretName: staging-abzora-ws-tls
  rules:
    - host: ws.staging.abzora.example.com
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: abzora-admin-ingress
spec:
  tls:
    - hosts:
        - admin.staging.abzora.example.com
      secretName: staging-abzora-admin-tls
  rules:
    - host: admin.staging.abzora.example.com
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: abzora-webhook-ingress
spec:
  tls:
    - hosts:
        - hooks.staging.abzora.example.com
      secretName: staging-abzora-hooks-tls
  rules:
    - host: hooks.staging.abzora.example.com
