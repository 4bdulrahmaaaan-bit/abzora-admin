apiVersion: apps/v1
kind: Deployment
metadata:
  name: abzora-api
  namespace: abzora
spec:
  replicas: 4
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: abzora-worker
  namespace: abzora
spec:
  replicas: 3
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: abzora-websocket
  namespace: abzora
spec:
  replicas: 3
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: abzora-api-hpa
  namespace: abzora
spec:
  minReplicas: 4
  maxReplicas: 30
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: abzora-worker-hpa
  namespace: abzora
spec:
  minReplicas: 3
  maxReplicas: 40
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: abzora-websocket-hpa
  namespace: abzora
spec:
  minReplicas: 3
  maxReplicas: 20
