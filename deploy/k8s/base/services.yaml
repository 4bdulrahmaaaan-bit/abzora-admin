apiVersion: v1
kind: Service
metadata:
  name: abzora-api
  namespace: abzora
spec:
  selector:
    app: abzora-api
  ports:
    - name: http
      port: 80
      targetPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: abzora-websocket
  namespace: abzora
spec:
  selector:
    app: abzora-websocket
  ports:
    - name: http
      port: 80
      targetPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: abzora-admin
  namespace: abzora
spec:
  selector:
    app: abzora-api
  ports:
    - name: http
      port: 80
      targetPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: abzora
spec:
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
