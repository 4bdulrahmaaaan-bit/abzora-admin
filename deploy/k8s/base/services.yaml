apiVersion: v1
kind: Service
metadata:
  name: abianzo-api
  namespace: abianzo
spec:
  selector:
    app: abianzo-api
  ports:
    - name: http
      port: 80
      targetPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: abianzo-websocket
  namespace: abianzo
spec:
  selector:
    app: abianzo-websocket
  ports:
    - name: http
      port: 80
      targetPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: abianzo-admin
  namespace: abianzo
spec:
  selector:
    app: abianzo-api
  ports:
    - name: http
      port: 80
      targetPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: abianzo
spec:
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
