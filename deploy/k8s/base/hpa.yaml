apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: abzora-api-hpa
  namespace: abzora
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: abzora-api
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
    - type: Pods
      pods:
        metric:
          name: http_request_latency_p95_ms
        target:
          type: AverageValue
          averageValue: "300"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: abzora-worker-hpa
  namespace: abzora
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: abzora-worker
  minReplicas: 2
  maxReplicas: 25
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
    - type: Pods
      pods:
        metric:
          name: queue_lag_seconds
        target:
          type: AverageValue
          averageValue: "15"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: abzora-websocket-hpa
  namespace: abzora
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: abzora-websocket
  minReplicas: 2
  maxReplicas: 15
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
