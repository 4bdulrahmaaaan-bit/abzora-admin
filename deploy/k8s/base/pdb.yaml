apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: abzora-api-pdb
  namespace: abzora
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: abzora-api
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: abzora-worker-pdb
  namespace: abzora
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: abzora-worker
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: abzora-websocket-pdb
  namespace: abzora
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: abzora-websocket
