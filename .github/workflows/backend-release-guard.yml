name: Backend Release Guard

on:
  push:
    branches:
      - main
      - 'release/**'
    paths:
      - 'backend/**'
      - '.github/workflows/backend-release-guard.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-release-guard.yml'
  workflow_dispatch:

concurrency:
  group: backend-release-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Prepare backend workspace
        run: |
          rm -rf backend
          git clone --depth 1 https://github.com/4bdulrahmaaaan-bit/abzora-backend.git backend
          ls -la backend
          cat backend/package.json

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: backend
        run: |
          npm ci || (echo "::warning::npm ci failed due to lockfile drift; using npm install fallback" && npm install --no-audit --no-fund)

      - name: Verify backend scripts
        working-directory: backend
        run: npm run

      - name: Run delivery test suite
        working-directory: backend
        run: npm test

      - name: Run payment race hardening tests
        working-directory: backend
        run: npm run test:security-races

      - name: Run outbox worker tests
        working-directory: backend
        run: npm run test:outbox-worker

      - name: Run outbox metrics security tests
        working-directory: backend
        run: npm run test:outbox-metrics

      - name: Run dead-letter replay tests
        working-directory: backend
        run: npm run test:outbox-replay

  release-candidate:
    name: Release Candidate Artifact
    runs-on: ubuntu-latest
    needs:
      - quality-gates
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Prepare backend workspace
        run: |
          rm -rf backend
          git clone --depth 1 https://github.com/4bdulrahmaaaan-bit/abzora-backend.git backend

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: backend
        run: |
          npm ci --omit=dev || (echo "::warning::npm ci --omit=dev failed due to lockfile drift; using npm install fallback" && npm install --omit=dev --no-audit --no-fund)

      - name: Build release manifest
        working-directory: backend
        run: |
          echo "commit=${GITHUB_SHA}" > release-manifest.txt
          echo "built_at=$(date -u +%FT%TZ)" >> release-manifest.txt
          echo "node_version=$(node -v)" >> release-manifest.txt

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-release-candidate
          path: |
            backend/release-manifest.txt
            backend/package.json
            backend/package-lock.json
